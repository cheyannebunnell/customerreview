<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Feedback Survey</title>

<ttps://www.gstatic.com/charts/loader.jsscript>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background-color: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

h1, h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    height: 120px;
}

.button-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    font-size: 15px;
}

.submit-btn {
    background: #28a745;
}

.results-btn {
    background: #007bff;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

#resultsSection {
    display: none;
    margin-top: 40px;
}

.chart {
    width: 100%;
    height: 450px;
    margin-bottom: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>Product Feedback Survey</h1>

<form id="surveyForm">

<label>How often do you use the product?</label>
<select name="usageFrequency" required>
  <option value="">Select One</option>
  <option>Daily</option>
  <option>Several Times Per Week</option>
  <option>Weekly</option>
  <option>Monthly</option>
  <option>Rarely</option>
</select>

<label>Which feature do you use most?</label>
<select name="favoriteFeature" required>
  <option value="">Select One</option>
  <option>Feature A</option>
  <option>Feature B</option>
  <option>Feature C</option>
  <option>Feature D</option>
</select>

<label>Overall Satisfaction</label>
<select name="satisfaction" required>
  <option value="">Select One</option>
  <option>Very Satisfied</option>
  <option>Satisfied</option>
  <option>Neutral</option>
  <option>Dissatisfied</option>
  <option>Very Dissatisfied</option>
</select>

<label>Describe your experience</label>
<textarea
name="freeResponse"
placeholder="Please tell us about your experience..."
required></textarea>

<div class="button-group">
  <button type="submit" class="submit-btn">
    Submit Survey
  </button>

  <button
    type="button"
    class="results-btn"
    onclick="loadResults()">
    View Results
  </button>
</div>

<div id="status"></div>

</form>

<div id="resultsSection">

<h2>Survey Results</h2>

<div id="usageChart" class="chart"></div>

<div id="featureChart" class="chart"></div>

<div id="satisfactionChart" class="chart"></div>

</div>

</div>

<script>

google.charts.load('current', {
  packages:['corechart']
});

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzWGyhoOVldnmnl85Lj_Q62nGZh0pZCF_r2BCS3t8CTd3ObGV7RWpXo3yID6TCruVEo7w/exec";


document
.getElementById("surveyForm")
.addEventListener("submit", submitSurvey);


function submitSurvey(event) {

  event.preventDefault();

  const formData = new FormData(event.target);

  const data = {};

  formData.forEach((value,key)=>{
    data[key] = value;
  });

  document.getElementById("status").innerHTML =
      "Submitting survey...";

  fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(data)
  })
  .then(response => response.text())
  .then(() => {

      document.getElementById("status").innerHTML =
          "✅ Survey submitted successfully.";

      document.getElementById("surveyForm").reset();

  })
  .catch(error => {

      console.error(error);

      document.getElementById("status").innerHTML =
          "❌ Submission failed.";

  });
}


function loadResults() {

  document.getElementById("status").innerHTML =
      "Loading results...";

  fetch(WEB_APP_URL + "?action=results")
  .then(response => response.json())
  .then(data => {

      console.log("Results:", data);

      document.getElementById("resultsSection")
      .style.display = "block";

      drawUsageChart(data.usageFrequency);
      drawFeatureChart(data.favoriteFeature);
      drawSatisfactionChart(data.satisfaction);

      document.getElementById("status").innerHTML =
          "✅ Results loaded.";

  })
  .catch(error => {

      console.error(error);

      document.getElementById("status").innerHTML =
          "❌ Unable to load results.";

      alert(
        "Could not load results. Check browser console (F12)."
      );

  });

}


function drawUsageChart(results) {

  const chartData = [
      ['Usage Frequency','Responses']
  ];

  Object.keys(results || {}).forEach(key => {
      chartData.push([key, results[key]]);
  });

  const data =
      google.visualization.arrayToDataTable(chartData);

  const chart =
      new google.visualization.ColumnChart(
          document.getElementById("usageChart")
      );

  chart.draw(data, {
      title: "Usage Frequency",
      legend: "none"
  });

}


function drawFeatureChart(results) {

  const chartData = [
      ['Feature','Responses']
  ];

  Object.keys(results || {}).forEach(key => {
      chartData.push([key, results[key]]);
  });

  const data =
      google.visualization.arrayToDataTable(chartData);

  const chart =
      new google.visualization.PieChart(
          document.getElementById("featureChart")
      );

  chart.draw(data, {
      title: "Favorite Features"
  });

}


function drawSatisfactionChart(results) {

  const chartData = [
      ['Satisfaction','Responses']
  ];

  Object.keys(results || {}).forEach(key => {
      chartData.push([key, results[key]]);
  });

  const data =
      google.visualization.arrayToDataTable(chartData);

  const chart =
      new google.visualization.BarChart(
          document.getElementById("satisfactionChart")
      );

  chart.draw(data, {
      title: "Customer Satisfaction"
  });

}

</script>

</body>
</html>
