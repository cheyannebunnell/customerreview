<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Feedback Survey</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
    h1 { text-align: center; }
    label { font-weight: bold; margin-top: 20px; display: block; }
    textarea { width: 100%; height: 120px; margin-top: 8px; }
    select, input[type="text"] { width: 100%; padding: 8px; margin-top: 8px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Product Feedback Survey</h1>

<form id="surveyForm">

  <label>How often do you use the product?</label>
  <select name="usageFrequency" required>
    <option value="">Select one</option>
    <option>Daily</option>
    <option>Several times a week</option>
    <option>Weekly</option>
    <option>Monthly</option>
    <option>Rarely</option>
  </select>

  <label>What feature do you use the most?</label>
  <select name="favoriteFeature" required>
    <option value="">Select one</option>
    <option>Feature A</option>
    <option>Feature B</option>
    <option>Feature C</option>
    <option>Other</option>
  </select>

  <label>Describe your experience using the product (free response):</label>
  <textarea name="freeResponse" required></textarea>

  <button type="submit">Submit</button>
  <div id="status"></div>

</form>

<script>
  const submitURL = "https://script.google.com/macros/s/AKfycbzWGyhoOVldnmnl85Lj_Q62nGZh0pZCF_r2BCS3t8CTd3ObGV7RWpXo3yID6TCruVEo7w/exec";

  document.getElementById("surveyForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(e.target);
    const payload = {};
    formData.forEach((v, k) => payload[k] = v);

    document.getElementById("status").textContent = "Submitting...";

    fetch(submitURL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      document.getElementById("status").textContent = "Thank you! Your feedback has been recorded.";
      e.target.reset();
    }).catch(() => {
      document.getElementById("status").textContent = "Error submitting form.";
    });
  });
</script>

</body>
</html>
