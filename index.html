<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Feedback Survey</title>

<!-- FIX: was a malformed tag (<ttps://...loader.jsscript>) -->
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background-color: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

h1, h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

textarea {
    height: 120px;
}

/* Honeypot: hidden from humans, bots tend to fill it in */
.hp {
    position: absolute;
    left: -9999px;
    height: 0;
    width: 0;
    overflow: hidden;
}

.button-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    font-size: 15px;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.submit-btn  { background: #28a745; }
.results-btn { background: #007bff; }

#status {
    margin-top: 15px;
    font-weight: bold;
}

#resultsSection {
    display: none;
    margin-top: 40px;
}

.chart {
    width: 100%;
    height: 450px;
    margin-bottom: 30px;
}

.empty-msg {
    text-align: center;
    color: #666;
    padding: 40px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>Product Feedback Survey</h1>

<form id="surveyForm">

<label for="usageFrequency">How often do you use the product?</label>
<select id="usageFrequency" name="usageFrequency" required>
  <option value="">Select One</option>
  <option>Daily</option>
  <option>Several Times Per Week</option>
  <option>Weekly</option>
  <option>Monthly</option>
  <option>Rarely</option>
</select>

<label for="favoriteFeature">Which feature do you use most?</label>
<select id="favoriteFeature" name="favoriteFeature" required>
  <option value="">Select One</option>
  <option>Feature A</option>
  <option>Feature B</option>
  <option>Feature C</option>
  <option>Feature D</option>
</select>

<label for="satisfaction">Overall Satisfaction</label>
<select id="satisfaction" name="satisfaction" required>
  <option value="">Select One</option>
  <option>Very Satisfied</option>
  <option>Satisfied</option>
  <option>Neutral</option>
  <option>Dissatisfied</option>
  <option>Very Dissatisfied</option>
</select>

<label for="freeResponse">Describe your experience</label>
<textarea
  id="freeResponse"
  name="freeResponse"
  placeholder="Please tell us about your experience..."
  maxlength="4000"
  required></textarea>

<!-- Honeypot field -->
<div class="hp" aria-hidden="true">
  <label>Leave this empty
    <input type="text" name="website" tabindex="-1" autocomplete="off">
  </label>
</div>

<div class="button-group">
  <button type="submit" class="submit-btn" id="submitBtn">
    Submit Survey
  </button>

  <button type="button" class="results-btn" id="resultsBtn">
    View Results
  </button>
</div>

</form>

<!-- FIX: status moved outside the form so it's independent of form reset -->
<div id="status" role="status" aria-live="polite"></div>

<div id="resultsSection">
  <h2>Survey Results</h2>
  <div id="usageChart" class="chart"></div>
  <div id="featureChart" class="chart"></div>
  <div id="satisfactionChart" class="chart"></div>
</div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzWGyhoOVldnmnl85Lj_Q62nGZh0pZCF_r2BCS3t8CTd3ObGV7RWpXo3yID6TCruVEo7w/exec";

// Keep display order sensible for the ordered categories
const USAGE_ORDER = ["Daily", "Several Times Per Week", "Weekly", "Monthly", "Rarely"];
const SATISFACTION_ORDER = ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"];

// FIX: wait for the charts library before drawing
google.charts.load('current', { packages: ['corechart'] });
const chartsReady = new Promise(resolve => google.charts.setOnLoadCallback(resolve));

let lastResults = null;

const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");
const resultsBtn = document.getElementById("resultsBtn");

document.getElementById("surveyForm").addEventListener("submit", submitSurvey);
resultsBtn.addEventListener("click", loadResults);

// Redraw charts on resize so they stay responsive
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (lastResults) drawAll(lastResults); }, 200);
});

function setStatus(msg) {
  statusEl.textContent = msg;
}


async function submitSurvey(event) {

  event.preventDefault();

  const form = event.target;
  const data = {};
  new FormData(form).forEach((value, key) => { data[key] = value; });

  // Honeypot tripped: pretend success, send nothing
  if (data.website) {
    setStatus("✅ Survey submitted successfully.");
    form.reset();
    return;
  }
  delete data.website;

  submitBtn.disabled = true;
  setStatus("Submitting survey...");

  try {
    // No Content-Type header on purpose: this sends text/plain,
    // which avoids a CORS preflight that Apps Script can't answer.
    const response = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    // FIX: actually check the server's reported status
    const result = await response.json();
    if (result.status !== "success") {
      throw new Error(result.message || "Server reported an error");
    }

    setStatus("✅ Survey submitted successfully.");
    form.reset();

  } catch (error) {
    console.error(error);
    setStatus("❌ Submission failed. Please try again.");
  } finally {
    submitBtn.disabled = false;
  }
}


async function loadResults() {

  resultsBtn.disabled = true;
  setStatus("Loading results...");

  try {
    const response = await fetch(WEB_APP_URL + "?action=results");

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (data.status === "error") {
      throw new Error(data.message || "Server reported an error");
    }

    await chartsReady;

    lastResults = data;
    document.getElementById("resultsSection").style.display = "block";
    drawAll(data);

    setStatus("✅ Results loaded.");

  } catch (error) {
    console.error(error);
    setStatus("❌ Unable to load results.");
  } finally {
    resultsBtn.disabled = false;
  }
}


function drawAll(data) {
  drawChart({
    elementId: "usageChart",
    results: data.usageFrequency,
    header: ["Usage Frequency", "Responses"],
    ChartType: google.visualization.ColumnChart,
    options: { title: "Usage Frequency", legend: "none" },
    order: USAGE_ORDER
  });

  drawChart({
    elementId: "featureChart",
    results: data.favoriteFeature,
    header: ["Feature", "Responses"],
    ChartType: google.visualization.PieChart,
    options: { title: "Favorite Features" }
  });

  drawChart({
    elementId: "satisfactionChart",
    results: data.satisfaction,
    header: ["Satisfaction", "Responses"],
    ChartType: google.visualization.BarChart,
    options: { title: "Customer Satisfaction", legend: "none" },
    order: SATISFACTION_ORDER
  });
}


// One shared draw function instead of three near-identical ones
function drawChart({ elementId, results, header, ChartType, options, order }) {

  const el = document.getElementById(elementId);
  const keys = Object.keys(results || {});

  // FIX: handle empty results instead of drawing a broken chart
  if (keys.length === 0) {
    el.innerHTML = '<div class="empty-msg">No responses yet for "' +
      options.title + '".</div>';
    return;
  }

  if (order) {
    keys.sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }

  const rows = [header];
  keys.forEach(key => rows.push([key, Number(results[key]) || 0]));

  const table = google.visualization.arrayToDataTable(rows);
  new ChartType(el).draw(table, options);
}

</script>

</body>
</html>
